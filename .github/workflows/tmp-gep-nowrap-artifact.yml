name: tmp-gep-nowrap-artifact

on:
  push:
    branches:
      - tmp/gep-nowrap-artifact-20260831

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply GEP no-wrap support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one match in {path}: {old[:80]!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # attributes.rs: first-class GEP no-wrap bitflags attribute.
          path = "pliron-llvm/src/attributes.rs"
          marker = '#[pliron_attr(name = "llvm.icmp_predicate", verifier = "succ", format)]\n'
          insertion = r'''bitflags! {
              /// No-wrap flags for getelementptr operations.
              #[derive(PartialEq, Eq, Clone, Debug, Hash, Copy)]
              pub struct GepNoWrapFlags: u8 {
                  const INBOUNDS = 1;
                  const NUSW = 2;
                  const NUW = 4;
              }
          }

          impl GepNoWrapFlags {
              /// Normalize flags to LLVM semantics: `inbounds` implies `nusw`.
              pub fn normalized(self) -> Self {
                  if self.contains(Self::INBOUNDS) {
                      self | Self::NUSW
                  } else {
                      self
                  }
              }
          }

          #[pliron_attr(name = "llvm.gep_no_wrap_flags", verifier = "succ")]
          #[derive(Debug, PartialEq, Eq, Clone, Copy, Hash)]
          pub struct GepNoWrapFlagsAttr(pub GepNoWrapFlags);

          impl Default for GepNoWrapFlagsAttr {
              fn default() -> Self {
                  Self(GepNoWrapFlags::empty())
              }
          }

          impl From<GepNoWrapFlags> for GepNoWrapFlagsAttr {
              fn from(value: GepNoWrapFlags) -> Self {
                  Self(value.normalized())
              }
          }

          impl From<GepNoWrapFlagsAttr> for GepNoWrapFlags {
              fn from(attr: GepNoWrapFlagsAttr) -> Self {
                  attr.0
              }
          }

          impl Display for GepNoWrapFlagsAttr {
              fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {
                  let flags = self.0.normalized();
                  write!(f, "<")?;
                  let mut first = true;
                  let mut emit = |name: &str| -> core::fmt::Result {
                      if !first {
                          write!(f, " | ")?;
                      }
                      first = false;
                      write!(f, "{name}")
                  };
                  if flags.contains(GepNoWrapFlags::INBOUNDS) {
                      emit("INBOUNDS")?;
                  } else if flags.contains(GepNoWrapFlags::NUSW) {
                      emit("NUSW")?;
                  }
                  if flags.contains(GepNoWrapFlags::NUW) {
                      emit("NUW")?;
                  }
                  write!(f, ">")
              }
          }

          impl_printable_for_display!(GepNoWrapFlagsAttr);

          #[derive(Debug, Error)]
          #[error("Error parsing GEP no-wrap flags: {0}")]
          pub struct GepNoWrapFlagParseErr(pub bitflags::parser::ParseError);

          impl Parsable for GepNoWrapFlagsAttr {
              type Arg = ();
              type Parsed = Self;

              fn parse<'a>(
                  state_stream: &mut pliron::parsable::StateStream<'a>,
                  _arg: Self::Arg,
              ) -> pliron::parsable::ParseResult<'a, Self::Parsed> {
                  let pos = state_stream.loc();
                  let allowed_chars = combine::choice!(
                      combine::parser::char::space().map(|c| c.to_string()),
                      combine::parser::char::alpha_num().map(|c| c.to_string()),
                      combine::parser::char::char('|').map(|c: char| c.to_string())
                  );

                  let (parsed, _): (Vec<String>, _) = combine::between(
                      combine::parser::char::char('<').with(spaces()),
                      spaces().with(combine::parser::char::char('>')),
                      combine::many(allowed_chars),
                  )
                  .parse_stream(state_stream)
                  .into_result()?;
                  let parsed_string = parsed.concat();

                  let (flags, _) = bitflags::parser::from_str::<GepNoWrapFlags>(&parsed_string)
                      .map_err(|e| input_error!(pos.clone(), GepNoWrapFlagParseErr(e)))
                      .into_parse_result()?;

                  Ok(GepNoWrapFlagsAttr(flags.normalized())).into_parse_result()
              }
          }

          '''
          replace_once(path, marker, insertion + marker)

          # ops.rs: model the flags as an optional attribute while preserving the old constructor.
          replace_once(
              "pliron-llvm/src/ops.rs",
              "attributes::{GepIndexAttr, GepIndicesAttr, ICmpPredicateAttr},",
              "attributes::{GepIndexAttr, GepIndicesAttr, GepNoWrapFlags, GepNoWrapFlagsAttr, ICmpPredicateAttr},",
          )
          replace_once(
              "pliron-llvm/src/ops.rs",
              'format = "`<` attr($gep_src_elem_type, $TypeAttr) `>` ` (` operands(CharSpace(`,`)) `)` attr($gep_indices, $GepIndicesAttr) ` : ` type($0)",',
              'format = "`<` attr($gep_src_elem_type, $TypeAttr) `>` ` (` operands(CharSpace(`,`)) `)` opt_attr($gep_no_wrap_flags, $GepNoWrapFlagsAttr) attr($gep_indices, $GepIndicesAttr) ` : ` type($0)",',
          )
          replace_once(
              "pliron-llvm/src/ops.rs",
              "attributes = (gep_src_elem_type: TypeAttr, gep_indices: GepIndicesAttr)",
              "attributes = (gep_src_elem_type: TypeAttr, gep_indices: GepIndicesAttr, gep_no_wrap_flags: GepNoWrapFlagsAttr)",
          )
          replace_once(
              "pliron-llvm/src/ops.rs",
              '''    pub fn new(\n        ctx: &mut Context,\n        base: Value,\n        indices: Vec<GepIndex>,\n        src_elem_type: TypeHandle,\n    ) -> Self {\n        use pliron::r#type::Typed;\n''',
              '''    pub fn new(\n        ctx: &mut Context,\n        base: Value,\n        indices: Vec<GepIndex>,\n        src_elem_type: TypeHandle,\n    ) -> Self {\n        Self::new_with_no_wrap_flags(\n            ctx,\n            base,\n            indices,\n            src_elem_type,\n            GepNoWrapFlags::empty(),\n        )\n    }\n\n    /// Create a new [GetElementPtrOp] with LLVM no-wrap flags.\n    pub fn new_with_no_wrap_flags(\n        ctx: &mut Context,\n        base: Value,\n        indices: Vec<GepIndex>,\n        src_elem_type: TypeHandle,\n        no_wrap_flags: GepNoWrapFlags,\n    ) -> Self {\n        use pliron::r#type::Typed;\n''',
          )
          replace_once(
              "pliron-llvm/src/ops.rs",
              '''        op.set_attr_gep_indices(ctx, GepIndicesAttr(attr));\n        op.set_attr_gep_src_elem_type(ctx, src_elem_type);\n        op\n    }\n\n    /// Get the source pointer's element type.\n''',
              '''        op.set_attr_gep_indices(ctx, GepIndicesAttr(attr));\n        op.set_attr_gep_src_elem_type(ctx, src_elem_type);\n        if !no_wrap_flags.is_empty() {\n            op.set_attr_gep_no_wrap_flags(ctx, no_wrap_flags.into());\n        }\n        op\n    }\n\n    /// Get the GEP no-wrap flags.\n    pub fn no_wrap_flags(&self, ctx: &Context) -> GepNoWrapFlags {\n        self.get_attr_gep_no_wrap_flags(ctx)\n            .map_or(GepNoWrapFlags::empty(), |attr| attr.0)\n    }\n\n    /// Get the source pointer's element type.\n''',
          )

          # core.rs: wrap LLVM 22's GEP no-wrap C API.
          replace_once(
              "pliron-llvm/src/llvm_sys/core.rs",
              "LLVMFastMathNoNaNs, LLVMFastMathNoSignedZeros, LLVMFastMathNone, LLVMInlineAsmDialect,\n    LLVMIntPredicate, LLVMLinkage, LLVMOpcode, LLVMRealPredicate, LLVMTypeKind, LLVMValueKind,",
              "LLVMFastMathNoNaNs, LLVMFastMathNoSignedZeros, LLVMFastMathNone, LLVMGEPFlagInBounds,\n    LLVMGEPFlagNUSW, LLVMGEPFlagNUW, LLVMGEPNoWrapFlags, LLVMInlineAsmDialect, LLVMIntPredicate,\n    LLVMLinkage, LLVMOpcode, LLVMRealPredicate, LLVMTypeKind, LLVMValueKind,",
          )
          replace_once(
              "pliron-llvm/src/llvm_sys/core.rs",
              "LLVMBuildFRem, LLVMBuildFSub, LLVMBuildFenceSyncScope, LLVMBuildFreeze, LLVMBuildGEP2,",
              "LLVMBuildFRem, LLVMBuildFSub, LLVMBuildFenceSyncScope, LLVMBuildFreeze, LLVMBuildGEP2,\n        LLVMBuildGEPWithNoWrapFlags,",
          )
          replace_once(
              "pliron-llvm/src/llvm_sys/core.rs",
              "LLVMGetFirstNamedMetadata, LLVMGetFirstParam, LLVMGetGEPSourceElementType,",
              "LLVMGetFirstNamedMetadata, LLVMGetFirstParam, LLVMGEPGetNoWrapFlags,\n        LLVMGetGEPSourceElementType,",
          )
          replace_once(
              "pliron-llvm/src/llvm_sys/core.rs",
              "use crate::attributes::FastmathFlags;",
              "use crate::attributes::{FastmathFlags, GepNoWrapFlags};",
          )
          marker = "/// LLVMPrintValueToString\n"
          insertion = r'''impl From<LLVMGEPNoWrapFlags> for GepNoWrapFlags {
              fn from(flags: LLVMGEPNoWrapFlags) -> Self {
                  let mut result = GepNoWrapFlags::empty();
                  if flags & LLVMGEPFlagInBounds != 0 {
                      result |= GepNoWrapFlags::INBOUNDS;
                  }
                  if flags & LLVMGEPFlagNUSW != 0 {
                      result |= GepNoWrapFlags::NUSW;
                  }
                  if flags & LLVMGEPFlagNUW != 0 {
                      result |= GepNoWrapFlags::NUW;
                  }
                  result.normalized()
              }
          }

          impl From<GepNoWrapFlags> for LLVMGEPNoWrapFlags {
              fn from(flags: GepNoWrapFlags) -> Self {
                  let flags = flags.normalized();
                  let mut result = 0;
                  if flags.contains(GepNoWrapFlags::INBOUNDS) {
                      result |= LLVMGEPFlagInBounds;
                  }
                  if flags.contains(GepNoWrapFlags::NUSW) {
                      result |= LLVMGEPFlagNUSW;
                  }
                  if flags.contains(GepNoWrapFlags::NUW) {
                      result |= LLVMGEPFlagNUW;
                  }
                  result
              }
          }

          '''
          replace_once("pliron-llvm/src/llvm_sys/core.rs", marker, insertion + marker)
          marker = "/// LLVMBuildInsertElement\n"
          insertion = r'''/// LLVMBuildGEPWithNoWrapFlags
          pub fn llvm_build_gep_with_no_wrap_flags(
              builder: &LLVMBuilder,
              ty: LLVMType,
              ptr: LLVMValue,
              indices: &[LLVMValue],
              name: &str,
              flags: GepNoWrapFlags,
          ) -> LLVMValue {
              assert!(llvm_get_insert_block(builder).is_some());
              assert!(
                  llvm_get_type_kind(llvm_get_scalar_type(llvm_type_of(ptr)))
                      == LLVMTypeKind::LLVMPointerTypeKind
              );
              let mut indices: Vec<_> = indices.iter().cloned().map(Into::into).collect();
              unsafe {
                  LLVMBuildGEPWithNoWrapFlags(
                      builder.inner_ref(),
                      ty.into(),
                      ptr.into(),
                      indices.as_mut_ptr(),
                      indices.len().try_into().unwrap(),
                      to_c_str(name).as_ptr(),
                      flags.into(),
                  )
                  .into()
              }
          }

          '''
          replace_once("pliron-llvm/src/llvm_sys/core.rs", marker, insertion + marker)
          marker = "/// LLVMGetNumIndices\n"
          insertion = r'''/// LLVMGEPGetNoWrapFlags
          pub fn llvm_get_gep_no_wrap_flags(gep: LLVMValue) -> GepNoWrapFlags {
              assert!(
                  llvm_is_a::get_element_ptr_inst(gep)
                      || (llvm_is_a::constant_expr(gep)
                          && llvm_get_const_opcode(gep) == LLVMOpcode::LLVMGetElementPtr)
              );
              unsafe { LLVMGEPGetNoWrapFlags(gep.into()) }.into()
          }

          '''
          replace_once("pliron-llvm/src/llvm_sys/core.rs", marker, insertion + marker)

          # from_llvm_ir.rs: preserve flags for both instruction and constant-expression GEPs.
          replace_once(
              "pliron-llvm/src/from_llvm_ir.rs",
              "llvm_get_fast_math_flags, llvm_get_fcmp_predicate, llvm_get_gep_source_element_type,",
              "llvm_get_fast_math_flags, llvm_get_fcmp_predicate, llvm_get_gep_no_wrap_flags,\n        llvm_get_gep_source_element_type,",
          )
          replace_once(
              "pliron-llvm/src/from_llvm_ir.rs",
              "let gep_op = GetElementPtrOp::new(ctx, m_base, indices, src_elm_type);",
              "let gep_op = GetElementPtrOp::new_with_no_wrap_flags(\n                        ctx,\n                        m_base,\n                        indices,\n                        src_elm_type,\n                        llvm_get_gep_no_wrap_flags(val),\n                    );",
          )
          replace_once(
              "pliron-llvm/src/from_llvm_ir.rs",
              "Ok(GetElementPtrOp::new(ctx, *base, indices, src_elm_type).get_operation())",
              "Ok(GetElementPtrOp::new_with_no_wrap_flags(\n                ctx,\n                *base,\n                indices,\n                src_elm_type,\n                llvm_get_gep_no_wrap_flags(inst),\n            )\n            .get_operation())",
          )

          # to_llvm_ir.rs: use the flag-aware builder.
          replace_once(
              "pliron-llvm/src/to_llvm_ir.rs",
              "llvm_build_freeze, llvm_build_frem, llvm_build_fsub, llvm_build_gep2, llvm_build_icmp,",
              "llvm_build_freeze, llvm_build_frem, llvm_build_fsub, llvm_build_gep_with_no_wrap_flags,\n        llvm_build_icmp,",
          )
          replace_once(
              "pliron-llvm/src/to_llvm_ir.rs",
              '''        let gep_op = llvm_build_gep2(\n            &cctx.builder,\n            src_elem_type,\n            base,\n            &indices,\n            self.get_result(ctx).unique_name(ctx).as_ref(),\n        );''',
              '''        let gep_op = llvm_build_gep_with_no_wrap_flags(\n            &cctx.builder,\n            src_elem_type,\n            base,\n            &indices,\n            self.get_result(ctx).unique_name(ctx).as_ref(),\n            self.no_wrap_flags(ctx),\n        );''',
          )

          # ir_expect.rs: add an LLVM -> Pliron -> LLVM regression test.
          marker = "/// Combinations of `struct` types\n"
          insertion = r'''/// GEP no-wrap flags must survive LLVM -> pliron -> LLVM conversion.
          #[test]
          fn llvm_ir_gep_no_wrap_flags_roundtrip() -> Result<()> {
              init_env_logger_for_tests!();
              let input = r#"
                  define ptr @gep_flags(ptr %p, i64 %i) {
                  entry:
                    %plain = getelementptr i8, ptr %p, i64 %i
                    %nusw = getelementptr nusw i8, ptr %p, i64 %i
                    %nuw = getelementptr nuw i8, ptr %p, i64 %i
                    %inbounds = getelementptr inbounds i8, ptr %p, i64 %i
                    %both = getelementptr inbounds nuw i8, ptr %p, i64 %i
                    ret ptr %both
                  }
              "#;

              let llvm_ctx = LLVMContext::default();
              let ctx = &mut Context::new();
              let module_op = common::parse_llvm_ir_verify(ctx, &llvm_ctx, input, "gep_flags")?;

              let pliron_text = module_op.disp(ctx).to_string();
              assert!(pliron_text.contains("<NUSW>"));
              assert!(pliron_text.contains("<NUW>"));
              assert!(pliron_text.contains("<INBOUNDS>"));
              assert!(pliron_text.contains("<INBOUNDS | NUW>"));

              let out_llvm_ctx = LLVMContext::default();
              let out_mod = to_llvm_ir::convert_module(ctx, &out_llvm_ctx, module_op)?;
              let out = out_mod.to_string();
              assert!(out.contains("getelementptr nusw i8"));
              assert!(out.contains("getelementptr nuw i8"));
              assert!(out.contains("getelementptr inbounds i8"));
              assert!(out.contains("getelementptr inbounds nuw i8"));
              Ok(())
          }

          '''
          replace_once("pliron-llvm/tests/ir_expect.rs", marker, insertion + marker)

          # metadata.rs: existing inbounds GEPs now visibly preserve their flags.
          replace_once(
              "pliron-llvm/tests/metadata.rs",
              "sp_v5 = llvm.gep <builtin.integer i32> (v1, v4)[OperandIdx(1)] : llvm.ptr (0) !0;",
              "sp_v5 = llvm.gep <builtin.integer i32> (v1, v4)<INBOUNDS>[OperandIdx(1)] : llvm.ptr (0) !0;",
          )
          replace_once(
              "pliron-llvm/tests/metadata.rs",
              "dp_v9 = llvm.gep <builtin.integer i32> (v0, v4)[OperandIdx(1)] : llvm.ptr (0) !3;",
              "dp_v9 = llvm.gep <builtin.integer i32> (v0, v4)<INBOUNDS>[OperandIdx(1)] : llvm.ptr (0) !3;",
          )
          replace_once(
              "pliron-llvm/tests/metadata.rs",
              "%sp_v5 = getelementptr i32, ptr %1, i64 %v4",
              "%sp_v5 = getelementptr inbounds i32, ptr %1, i64 %v4",
          )
          replace_once(
              "pliron-llvm/tests/metadata.rs",
              "%dp_v9 = getelementptr i32, ptr %0, i64 %v4",
              "%dp_v9 = getelementptr inbounds i32, ptr %0, i64 %v4",
          )
          PY

      - name: Format changed Rust files
        run: cargo fmt --all

      - name: Create replacement ZIP
        shell: bash
        run: |
          rm -rf /tmp/gep-nowrap-artifact
          mkdir -p /tmp/gep-nowrap-artifact/pliron-llvm/src/llvm_sys /tmp/gep-nowrap-artifact/pliron-llvm/tests
          cp pliron-llvm/src/attributes.rs /tmp/gep-nowrap-artifact/pliron-llvm/src/
          cp pliron-llvm/src/ops.rs /tmp/gep-nowrap-artifact/pliron-llvm/src/
          cp pliron-llvm/src/llvm_sys/core.rs /tmp/gep-nowrap-artifact/pliron-llvm/src/llvm_sys/
          cp pliron-llvm/src/from_llvm_ir.rs /tmp/gep-nowrap-artifact/pliron-llvm/src/
          cp pliron-llvm/src/to_llvm_ir.rs /tmp/gep-nowrap-artifact/pliron-llvm/src/
          cp pliron-llvm/tests/ir_expect.rs /tmp/gep-nowrap-artifact/pliron-llvm/tests/
          cp pliron-llvm/tests/metadata.rs /tmp/gep-nowrap-artifact/pliron-llvm/tests/
          cd /tmp/gep-nowrap-artifact
          zip -r "$GITHUB_WORKSPACE/pliron-gep-nowrap-files.zip" pliron-llvm

      - name: Upload replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pliron-gep-nowrap-files
          path: pliron-gep-nowrap-files.zip
          if-no-files-found: error
          retention-days: 1
